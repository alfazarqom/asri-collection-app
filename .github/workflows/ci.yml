name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies for Deno npm resolution
        run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Edge Functions
        run: |
          deno check supabase/functions/asri-get-products/index.ts
          deno check supabase/functions/asri-create-order/index.ts
          deno check supabase/functions/asri-create-midtrans-payment/index.ts
          deno check supabase/functions/asri-midtrans-notification/index.ts
          deno check supabase/functions/asri-get-order-status/index.ts

  database-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Apply migrations to clean local database
        run: supabase db reset
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
